services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartstock
      POSTGRES_DB: smartstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartstock -d smartstock"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      args:
        INSTALL_AI: ${INSTALL_AI:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartstock:${POSTGRES_PASSWORD}@db:5432/smartstock
      STORAGE_PATH: /app/data
      APP_ENV: production
      AUTO_WORKER: "false"
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - business_files:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      args:
        INSTALL_AI: ${INSTALL_AI:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartstock:${POSTGRES_PASSWORD}@db:5432/smartstock
      STORAGE_PATH: /app/data
      APP_ENV: production
      AUTO_WORKER: "false"
    command: ["python", "-m", "src.services.jobs"]
    healthcheck:
      disable: true
    volumes:
      - business_files:/app/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  business_files:
